# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=net.pr1nted.openarcade
java_version=8

# Common
minecraft_version=1.13.2
mod_name=Open Arcade
mod_author=Pr1nted
mod_id=openarcade
license=MIT
credits=
description=Browse and open itch.io and Newgrounds web games from inside Minecraft.
minecraft_version_range=[1.13.2, 1.14)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.20.6-20240627.102356

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.139.5+1.21.11
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=20.6.141
neoforge_loader_version_range=[2,)

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/
# Compiled against 61.0.1, the build ForgeGradle 6 can still set up: Forge's newer 1.21.11
# dev files need ForgeGradle 7 and Gradle 9, which Loom's obfuscated-era plugin does not
# run on. forge_loader_version_range still accepts every 61.x, and CI plays the newest.
forge_version=25.0.223
forge_loader_version_range=[25,)

# Mod Menu (Fabric, optional, compile-only)
modmenu_version=1.7.18

# Folia / Paper plugin API
paper_api_version=1.16.5-R0.1-SNAPSHOT

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
paper_api_group=com.destroystokyo.paper

# 1.13.2 has no Mojang mappings: Forge names (MCP) are what the code is written in.
mcp_snapshot=20190311-1.13.2
