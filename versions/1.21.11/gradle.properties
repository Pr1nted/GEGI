# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=net.pr1nted.openarcade
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Open Arcade
mod_author=Pr1nted
mod_id=openarcade
license=MIT
credits=
description=Browse and open itch.io and Newgrounds web games from inside Minecraft.
minecraft_version_range=[1.21.11, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.139.5+1.21.11
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.45
neoforge_loader_version_range=[4,)

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/
# Compiled against 61.0.1, the build ForgeGradle 6 can still set up: Forge's newer 1.21.11
# dev files need ForgeGradle 7 and Gradle 9, which Loom's obfuscated-era plugin does not
# run on. forge_loader_version_range still accepts every 61.x, and CI plays the newest.
forge_version=61.0.1
forge_loader_version_range=[61,)

# Mod Menu (Fabric, optional, compile-only)
modmenu_version=17.0.0

# Folia / Paper plugin API
paper_api_version=1.21.11-R0.1-SNAPSHOT

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
