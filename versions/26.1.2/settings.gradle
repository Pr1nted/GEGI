pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = '26.1.2'
includeBuild('build-logic')
// The version-independent core and the Chromium helper live at the top of the repository
// and are shared by every versions/<minecraft> build.
include('core')
project(':core').projectDir = file('../../core')
include('common')
include('fabric')
include('neoforge')
include('forge')
include('folia')
include('browser')
project(':browser').projectDir = file('../../browser')
