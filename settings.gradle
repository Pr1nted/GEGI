// The version-independent half of GEGI, buildable and testable on its own:
//   ./gradlew :core:test :browser:smokeTest
// Each Minecraft version is its own build under versions/<minecraft>/, with its own
// Gradle, plugins and Java, and includes these two projects from here.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'GEGI'
include('core')
include('browser')
