# GEGI CI: every Minecraft version, every loader, launched for real.
#
#   plan      read versions/*/port.json; every job below is a matrix over them, so a
#             new port is a new directory and nothing here changes
#   build     compile each version's loaders and Folia plugin (and the shared core,
#             with its unit tests); upload the jars
#   client    start the actual Minecraft client, headless, on each version's loaders
#             with the mod installed (headlesshq/mc-runtime-test). With
#             GEGI_SELFTEST=1 the mod opens its own menu, checks the Options
#             button and the /gegi command, and crashes the game if any of it
#             fails, so a pass means the menu works, not just that the jar loaded
#   selfdrive the same for versions MC-Runtime-Test has no build for (1.13 to 1.15):
#             HeadlessMC starts the client and the mod's self-test makes its own world
#   quilt     the same, on Quilt, which the action does not install
#   folia     a Folia server starts with the plugin enabled
#   chromium  the in-game browser without Minecraft, on Linux, Windows and macOS and on
#             Java 8 and 25: Chromium downloads, a page loads, and a click, a key, a
#             typed character and a resize all reach it (:browser:smokeTest)
name: CI

on:
  # Branches only: a release tag runs this through release.yml, which publishes what it built.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      minecraft:
        description: Only this version (empty for all)
        required: false
  workflow_call:
    inputs:
      minecraft:
        type: string
        required: false
      ref:
        description: The branch to test (the port workflow tests its port branch)
        type: string
        required: false

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref || 'self' }}-${{ inputs.minecraft || 'all' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      clients: ${{ steps.plan.outputs.clients }}
      selfdrive: ${{ steps.plan.outputs.selfdrive }}
      quilt: ${{ steps.plan.outputs.quilt }}
      folia: ${{ steps.plan.outputs.folia }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: plan
        env:
          GEGI_ONLY_VERSION: ${{ inputs.minecraft }}
        run: python3 ci/plan.py

  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.versions) }}
    name: build (${{ matrix.minecraft }})
    defaults:
      run:
        working-directory: versions/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      # The wrapper downloads Gradle once, with no retry; services.gradle.org sometimes answers 504
      # or stalls for minutes (the wrapper's own timeout is 60 s, set in gradle-wrapper.properties).
      - name: Fetch Gradle
        run: for attempt in 1 2 3 4 5; do ./gradlew --version --console=plain && exit 0; sleep 60; done; exit 1
      - name: Build every loader
        run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/*/build/libs/gegi-*.jar
          if-no-files-found: error

  client:
    needs: [plan, build]
    # Every version's clients run even when another version's build failed; a version whose
    # own build failed has no jars, so only its legs fail.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.clients != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.clients) }}
    name: client (${{ matrix.minecraft }}, ${{ matrix.loader }})
    env:
      GEGI_SELFTEST: "1"
    steps:
      # GitHub's artifact service sometimes answers 403 for a moment: one more try after a pause.
      - id: jars
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: jars-${{ matrix.minecraft }}
      - if: steps.jars.outcome == 'failure'
        run: sleep 60
      - if: steps.jars.outcome == 'failure'
        uses: actions/download-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install the mod
        run: |
          mkdir -p run/mods
          cp ${{ matrix.loader }}/build/libs/gegi-${{ matrix.loader }}-*.jar run/mods/
          # the -sources and -javadoc jars are not mods
          rm -f run/mods/*-sources.jar run/mods/*-javadoc.jar
          ls -l run/mods
      - name: Run the ${{ matrix.loader }} client
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ matrix.minecraft }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          java: ${{ matrix.java }}
          mc-runtime-test: ${{ matrix.mcrt }}
      # A launch that joins a world and quits is not a pass by itself: the mod's
      # self-test writes this file only after /arcade, the Options button and the
      # menu all worked. No file, no pass.
      - name: The self-test ran and passed
        run: |
          test -f run/gegi-selftest-passed || { echo "::error::GEGI's in-game self-test did not pass on ${{ matrix.minecraft }} ${{ matrix.loader }}"; exit 1; }
          echo "self-test passed on ${{ matrix.minecraft }} ${{ matrix.loader }}"

  selfdrive:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.selfdrive != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.selfdrive) }}
    name: client (${{ matrix.minecraft }}, ${{ matrix.loader }})
    env:
      GEGI_SELFTEST: "1"
      # No MC-Runtime-Test to join a world: the self-test creates one, and quits after.
      GEGI_SELFTEST_CREATE_WORLD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # GitHub's artifact service sometimes answers 403 for a moment: one more try after a pause.
      - id: jars
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - if: steps.jars.outcome == 'failure'
        run: sleep 60
      - if: steps.jars.outcome == 'failure'
        uses: actions/download-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v4
        with:
          path: ~/.minecraft
          key: ${{ runner.os }}-${{ matrix.minecraft }}-${{ matrix.loader }}-hmc
      - name: Run the ${{ matrix.loader }} client
        run: ci/client-selfdrive.sh "${{ matrix.minecraft }}" "${{ matrix.loader }}" jars

  quilt:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.quilt != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.quilt) }}
    name: quilt (${{ matrix.minecraft }})
    env:
      GEGI_SELFTEST: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # GitHub's artifact service sometimes answers 403 for a moment: one more try after a pause.
      - id: jars
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - if: steps.jars.outcome == 'failure'
        run: sleep 60
      - if: steps.jars.outcome == 'failure'
        uses: actions/download-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v4
        with:
          path: ~/.minecraft
          key: ${{ runner.os }}-${{ matrix.minecraft }}-quilt-hmc
      - name: Run the Quilt client
        run: ci/quilt-runtime.sh "${{ matrix.minecraft }}" jars/fabric/build/libs

  folia:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.folia != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.folia) }}
    name: folia (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # GitHub's artifact service sometimes answers 403 for a moment: one more try after a pause.
      - id: jars
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - if: steps.jars.outcome == 'failure'
        run: sleep 60
      - if: steps.jars.outcome == 'failure'
        uses: actions/download-artifact@v5
        with:
          name: jars-${{ matrix.minecraft }}
          path: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Start Folia with the plugin
        run: ci/folia-smoke.sh "${{ matrix.minecraft }}" jars/folia/build/libs

  chromium:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            java: "25"
          - os: ubuntu-24.04
            java: "8"
          - os: windows-2025
            java: "25"
          - os: macos-15
            java: "25"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v5
        id: smoke-java
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Chromium is ~100 MB; the mod downloads it once per player, CI once per OS.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gegi-chromium/jcef-bundle
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/build.gradle') }}
      - name: Drive the helper (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew :core:test :browser:smokeTest --console=plain "-PsmokeJavaHome=${{ steps.smoke-java.outputs.path }}" "-PsmokeInstall=${{ runner.temp }}/gegi-chromium"
      - name: Drive the helper
        if: runner.os != 'Linux'
        run: ./gradlew :browser:smokeTest --console=plain "-PsmokeJavaHome=${{ steps.smoke-java.outputs.path }}" "-PsmokeInstall=${{ runner.temp }}/gegi-chromium"
